# Primary policy model. Frozen — do not change without logging in notes/.
role: primary_policy
model_id: "Qwen/Qwen3.5-4B"
revision: "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"   # HF commit SHA, pinned Day 2 via
                                 # huggingface.co/api/models/Qwen/Qwen3.5-4B (lastModified
                                 # 2026-03-02, matches the release date). Per invariant #3,
                                 # this revision is part of pool identity — any future upstream
                                 # commit to this repo is a NEW pool, never a silent continuation.
                                 # model_id below CONFIRMED Day 1 (G0): this is the correct, exact HF slug.
                                 # It is the post-trained (chat) repo — Qwen3.5 naming puts
                                 # pretrained-only weights under the separate "-Base" suffix
                                 # (Qwen/Qwen3.5-4B-Base), unlike Qwen3's "-Instruct-2507"
                                 # convention. Released 2026-03-02 on HF + ModelScope. 5.17B
                                 # params, bf16/f32 safetensors, Apache 2.0, native 262144
                                 # context (extensible to ~1.01M via YaRN). Supports
                                 # enable_thinking:false to disable thinking mode.
thinking_mode: false            # non-thinking is a methodological choice, not a shortcut:
                                 # thinking mode inflates output length 3-5x, which would
                                 # confound every matched-token comparison (H1, H4)
decode:
  temperature: 0.8
  top_p: 0.95
  max_tokens: 1024
backends:
  - type: api_host          # DEFAULT backend as of 2026-08-20 -- mentor-provided, confirmed
                              # stable for the full four weeks, not a fallback.
    provider: hosted_endpoint
    config_ref: "configs/backends/hosted-endpoints.yaml#policy"
    status: confirmed         # live-tested 2026-08-20: /v1/models, /v1/chat/completions with
                              # enable_thinking=false, logprobs, all confirmed working.
    caveat: >
      Serves a third-party unsloth GGUF conversion via llama.cpp, NOT the
      official Qwen/Qwen3.5-4B safetensors via vLLM -- see the
      IMPORTANT_CAVEAT block in configs/backends/hosted-endpoints.yaml
      before assuming pool-equivalence with the local_vllm backend below.
  - type: local_vllm         # secondary backend -- available via the raw GPU servers
                              # (194.149.138.12, 194.149.138.21) if/when used; not yet exercised.
    quantization: bf16
    status: confirmed_available   # Day 1 (G0): vLLM officially documents serving the Qwen3.5
                                 # family (docs.vllm.ai/projects/recipes/en/stable/Qwen/Qwen3.5.html).
                                 # Non-thinking via --default-chat-template-kwargs
                                 # '{"enable_thinking": false}'; seed via --seed; logprobs via
                                 # --logprobs_mode processed_logprobs. Not yet run for real (no
                                 # GPU access until the raw servers above are actually used).
notes: >
  Updated from Qwen3-4B on Day 1 (G0). Neither Qwen3-4B nor Qwen3.5-4B
  appears in the baseline papers being reproduced (both predate Qwen3),
  so this swap costs no comparability to published numbers.

  Day 1 G0 hosted-API survey (2026-08-18): could not confirm a public
  hosted API serving this exact post-trained model as a simple
  pay-per-token endpoint (checked 8 hosts; see notes/2026-08-18.md). The
  >=2-backend requirement was WAIVED that day as an accepted risk.

  **2026-08-20: G0 formally un-waived.** Mentor provided dedicated hosted
  infrastructure (see configs/backends/hosted-endpoints.yaml), confirmed
  stable for the full four weeks -- treated as the primary/default
  backend, not a fallback. Two real backends now exist: this hosted
  endpoint, plus local vLLM via the mentor-provided raw GPU servers if/
  when used. See notes/2026-08-20.md and docs/brief.md's R0 risk row for
  the full reversal writeup, including the GGUF/llama.cpp caveat above --
  flagged because it's pool-identity-relevant per §27.6, not because it
  blocks anything.
