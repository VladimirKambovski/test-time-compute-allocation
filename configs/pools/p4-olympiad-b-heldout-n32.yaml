# P4 -- held-out, in-distribution (OlympiadBench slice B, 100 problems,
# N=32 MUST). Day 18. Pre-flight verified before this run: the frozen
# id list's SHA-256 matches configs/benchmarks/heldout-olympiad-b.yaml's
# documented hash exactly, and the 100 ids are confirmed disjoint from
# olympiad-a (P2's dev set) by direct set comparison. G8 has fired
# (Day 17 done) -- this is the planned final evaluation, one pass, no
# re-tuning after seeing these results, per docs/brief.md invariant #8
# and this config's own `rule` field.
#
# Decode config matches configs/policies/qwen3.5-4b.yaml and P2's
# config EXACTLY -- max_tokens=1024, the frozen default. Same dataset/
# config as P2 (OlympiadBench, OE_TO_maths_en_COMP), just the held-out
