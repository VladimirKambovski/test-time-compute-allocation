policy_ref: qwen3.5-4b
backend_ref: policy_primary
benchmark_id: olympiad-b-heldout
n: 32
max_workers: 10   # matches P2's exact concurrency (same benchmark/config, same
                  # completion-length regime, already proven safe at this value)

benchmark:
  dataset_id: "Hothan/OlympiadBench"
  config: "OE_TO_maths_en_COMP"
  ids_file: "configs/benchmarks/data/heldout-olympiad-b-ids.json"

decode:
  temperature: 0.8
  top_p: 0.95
  max_tokens: 1024
  seed: null
  thinking_mode: false
  stop_sequences: []
