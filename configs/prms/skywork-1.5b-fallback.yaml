# Fallback PRM (resource ladder rung 2). Same job as the primary, smaller.
# Only used if the primary doesn't fit available compute — this is an
# automatic, allowed fallback (unlike an ORM/judge substitution, which
# requires gate G10). Log the switch in notes/ if it's ever used.
role: fallback_prm
model_id: "Skywork/Skywork-o1-Open-PRM-Qwen-2.5-1.5B"   # VERIFY exact slug before use
scorer_type: scalar_step_level
segmentation_conventions:
  - double_newline
  - step_prefix
  - special_token
backends:
  - type: api_host          # DEFAULT as of 2026-08-20 -- mentor-provided, confirmed stable
                              # for the full four weeks, not a fallback.
    provider: hosted_endpoint
    config_ref: "configs/backends/hosted-endpoints.yaml#prm_fallback"
    status: confirmed         # live-tested 2026-08-20: /score returned plausible step_rewards
                              # for a toy 2-line response.
    chat_template: none       # do NOT apply_chat_template -- server uses its own prepare_input()
                              # given {problem, response, step_token}; send raw response text.
  - type: local_gpu          # secondary -- available via the raw GPU servers
                              # (194.149.138.12, 194.149.138.21) if/when used; not yet exercised.
    status: available_not_exercised
