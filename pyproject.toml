[project]
name = "marginal-token"
version = "0.1.0"
description = "Evidence-driven test-time compute allocation for small reasoning models"
requires-python = ">=3.10"
dependencies = [
    "vllm>=0.17.0",  # 0.17.0 is the first release with full Qwen3.5 support (Day 2, G0 follow-up);
                     # unpinned resolution was grabbing vllm==0.1.3, which predates prebuilt
                     # wheels and tries to source-build against a nonexistent local CUDA toolchain
    "transformers",
    "torch",
    "accelerate",
    "scikit-learn",
    "numpy",
    "pandas",
    "scipy",
    "pydantic>=2",
    "fastapi",
    "uvicorn",
    "pyyaml",
    "pytest",
    "langfuse",
    # "math-verify",  # install per its own repo instructions -- pin exact source
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
